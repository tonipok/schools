<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Щоденник — шкільна платформа</title>
<style>
  :root{
    --paper:#F1E8D8;
    --paper-dark:#E7DBC4;
    --ink:#2B2620;
    --ink-soft:#5A5245;
    --maroon:#7A2E2E;
    --maroon-dark:#5E2222;
    --chalk:#2F4F3D;
    --chalk-light:#3E6650;
    --brass:#AB824A;
    --brass-light:#D8B876;
    --sky:#3B5B72;
    --sky-light:#557790;
    --line:#C9BC9F;
    --danger:#8C3B34;
    --ok:#3D6B4A;
    --radius:3px;
    --shadow: 2px 2px 0 rgba(43,38,32,0.08);
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-head: Georgia, "Iowan Old Style", Palatino, "Book Antiqua", serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 28px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height:1.45;
    min-height:100vh;
  }
  #app{max-width: 920px; margin: 0 auto; padding-bottom: 60px;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background: var(--brass-light);}

  /* ---------- Top bar ---------- */
  .topbar{
    background: var(--maroon);
    color:#F1E8D8;
    padding: 14px 16px 10px;
    position: sticky; top:0; z-index: 20;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{
    font-family: var(--font-head);
    font-size: 20px;
    letter-spacing: 0.2px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .mark{
    display:inline-block; width:26px; height:26px; border-radius:50%;
    background: var(--brass-light); color: var(--maroon-dark);
    text-align:center; line-height:26px; font-size:14px; font-family:var(--font-body); font-weight:700;
  }
  .who{display:flex; align-items:center; gap:8px; font-size:13px;}
  .who .av{
    width:30px; height:30px; border-radius:50%; background: var(--brass-light);
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
    border: 2px solid rgba(255,255,255,0.5);
  }
  .who .nm{font-weight:600;}
  .btn-ghost-topbar{
    background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff;
    padding:5px 10px; border-radius: var(--radius); font-size:12px; cursor:pointer;
  }
  .btn-ghost-topbar:hover{background:rgba(255,255,255,0.12);}

  /* ---------- Tab rail (diary tabs) ---------- */
  .tabrail{
    display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:2px;
    scrollbar-width: thin;
  }
  .tabrail::-webkit-scrollbar{height:4px;}
  .tab{
    flex: 0 0 auto;
    background: var(--paper);
    color: var(--ink-soft);
    border: none;
    padding: 8px 14px 7px;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0% 100%);
    white-space:nowrap;
  }
  .tab.active{ background: var(--paper-dark); color: var(--maroon); }

  /* ---------- Content panel ---------- */
  .panel{
    background: var(--paper);
    border: 1px solid var(--line);
    margin: 14px 12px;
    padding: 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .panel h2{
    font-family: var(--font-head);
    margin:0 0 12px;
    font-size:19px;
    color: var(--maroon);
    padding-bottom:8px;
    border-bottom: 2px solid var(--line);
  }
  .panel h3{ font-family: var(--font-head); font-size:15px; margin: 18px 0 8px; color: var(--chalk); }
  .subtle{color: var(--ink-soft); font-size:13px;}
  .empty-note{
    border: 1px dashed var(--line); padding: 14px; text-align:center; color: var(--ink-soft);
    font-size:13px; border-radius: var(--radius);
  }

  /* ---------- Form controls ---------- */
  label{display:block; font-size:12px; color:var(--ink-soft); margin: 10px 0 4px; font-weight:600;}
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius: var(--radius);
    background:#FBF7ED; font-family:inherit; font-size:14px; color:var(--ink);
  }
  textarea{resize:vertical; min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--sky); outline-offset:1px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:120px;}

  .btn{
    display:inline-block; padding:9px 16px; border-radius: var(--radius); border:none;
    font-weight:700; font-size:13px; cursor:pointer; margin-top:10px;
  }
  .btn-primary{ background: var(--maroon); color:#fff; }
  .btn-primary:hover{ background: var(--maroon-dark); }
  .btn-secondary{ background: var(--chalk); color:#fff; }
  .btn-secondary:hover{ background: var(--chalk-light); }
  .btn-brass{ background: var(--brass); color:#2B2620; }
  .btn-danger{ background: var(--danger); color:#fff; }
  .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-sm{ padding:5px 10px; font-size:12px; margin-top:0; }
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  .pill{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .pill-ok{background:#E1EBE3; color:var(--ok);}
  .pill-wait{background:#F4E7CB; color:#8A6A2A;}
  .pill-bad{background:#F1DCDA; color:var(--danger);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{ text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
  th{color:var(--ink-soft); font-size:11px; text-transform: none; font-weight:700;}

  .card{
    border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:10px; background:#FBF7ED;
  }
  .card-title{font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .grade-chip{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; font-weight:700; font-size:13px; color:#fff; background:var(--sky);
  }
  .grade-chip.g-low{background:var(--danger);}
  .grade-chip.g-mid{background:var(--brass);}
  .grade-chip.g-high{background:var(--ok);}

  /* login */
  .login-wrap{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .login-card{
    background:var(--paper); border:1px solid var(--line); box-shadow: 4px 4px 0 rgba(43,38,32,0.15);
    padding:26px 24px; width:100%; max-width:340px; border-radius: var(--radius);
  }
  .login-card h1{ font-family: var(--font-head); color:var(--maroon); font-size:22px; margin:0 0 4px;}
  .login-err{ color:var(--danger); font-size:13px; margin-top:8px; min-height:16px; }

  /* chat */
  .chat-box{ height: 340px; overflow-y:auto; border:1px solid var(--line); background:#FBF7ED; padding:10px; margin-bottom:8px; border-radius:var(--radius);}
  .msg{ margin-bottom:10px; max-width:85%; }
  .msg .meta{font-size:11px; color:var(--ink-soft); margin-bottom:2px;}
  .msg .bubble{background:#fff; border:1px solid var(--line); padding:7px 10px; border-radius:var(--radius); display:inline-block;}
  .msg.mine{margin-left:auto; text-align:right;}
  .msg.mine .bubble{background: var(--sky); color:#fff; border-color:var(--sky);}

  /* notebook themes */
  .nb-editor{min-height:260px; padding:14px; border-radius:var(--radius); outline:none; border:1px solid var(--line);}
  .nb-theme-cream{background:#F6EFDD repeating-linear-gradient(#F6EFDD, #F6EFDD 27px, #D9CBA8 28px); color:#2B2620;}
  .nb-theme-grid{background:#fff repeating-linear-gradient(0deg,#fff,#fff 23px,#DCE9F2 24px), repeating-linear-gradient(90deg,transparent,transparent 23px,#DCE9F2 24px); color:#1c2b36;}
  .nb-theme-dark{background:#1E2E24 repeating-linear-gradient(#1E2E24,#1E2E24 27px,#33473A 28px); color:#EAF3EC; font-family:var(--font-head);}
  .nb-theme-kraft{background:#C9A876; color:#3B2A16;}
  .nb-theme-pink{background:#F6DEE6 repeating-linear-gradient(#F6DEE6,#F6DEE6 27px,#E9BFCE 28px); color:#5A2436;}
  .nb-theme-mint{background:#DCEFE3 repeating-linear-gradient(#DCEFE3,#DCEFE3 27px,#BFE0CE 28px); color:#1F4230;}
  .nb-theme-sticky{background:#FBE889; color:#4a4322; box-shadow: inset 0 0 0 6px #F3DE6E;}
  .nb-theme-vintage{background:#E7D9B8; color:#4a3a20; font-family: var(--font-head); box-shadow: inset 0 0 40px rgba(120,90,40,0.25);}
  .nb-theme-blueprint{background:#0F3C5F repeating-linear-gradient(0deg,#0F3C5F,#0F3C5F 23px,#1C5588 24px), repeating-linear-gradient(90deg,transparent,transparent 23px,#1C5588 24px); color:#DCEBF7;}
  .nb-theme-redline{background:#fff; color:#222; border-left:3px solid #C0504D; background-image: linear-gradient(#CFE0EF 1px, transparent 1px); background-size:100% 26px; padding-left:26px;}
  .nb-theme-night{background:#101425; color:#EFEFFA;}
  .nb-theme-choco{background:#3B2A22 repeating-linear-gradient(#3B2A22,#3B2A22 27px,#4C382D 28px); color:#EFE2D6;}

  .theme-swatch{ width:44px; height:32px; border-radius:3px; border:2px solid transparent; cursor:pointer; flex:0 0 auto;}
  .theme-swatch.sel{ border-color: var(--maroon); }
  .font-opt{ padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; background:#FBF7ED; font-size:13px; }
  .font-opt.sel{ border-color:var(--maroon); background:#F1DCDA; }
  .marker-swatch{ width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px var(--line);}

  .nick-colored{font-weight:700;}

  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff; padding:9px 16px; border-radius:var(--radius);
    font-size:13px; z-index:100; box-shadow: var(--shadow);
  }

  .coin{color:#8A6A2A; font-weight:700;}
  .hidden{display:none !important;}
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .small-muted{font-size:11px; color:var(--ink-soft);}

  @media (max-width:480px){
    .panel{margin:10px 6px; padding:12px;}
    .brand{font-size:17px;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js" crossorigin="anonymous"></script>

<body>
<div id="app"></div>
<script>
/* ============================================================
   КОНФІГУРАЦІЯ
   ============================================================ */
// Щоб ВИМКНУТИ авторизацію (для розробки/тестування) — постав false.
// Якщо false — сайт одразу відкриється під обліковим записом DEV_AUTOLOGIN_USER.
const AUTH_ENABLED = true;
const DEV_AUTOLOGIN_USER = "tonipok";

const STORAGE_KEY = "school-db-v1";
const GRADE_MIN = 1, GRADE_MAX = 12;
const DAYS = ["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];

const NB_THEMES = [
  {id:"cream", name:"Кремовий папір", cls:"nb-theme-cream"},
  {id:"grid", name:"Клітинка", cls:"nb-theme-grid"},

  {id:"mint", name:"М'ятний", cls:"nb-theme-mint"},
  {id:"sticky", name:"Стікер", cls:"nb-theme-sticky"},
  {id:"vintage", name:"Вінтаж", cls:"nb-theme-vintage"},
  {id:"blueprint", name:"Креслення", cls:"nb-theme-blueprint"},
  {id:"redline", name:"Зошит у лінію", cls:"nb-theme-redline"},
  {id:"night", name:"Нічне небо", cls:"nb-theme-night"},
  {id:"choco", name:"Шоколад", cls:"nb-theme-choco"}
];
const NB_FONTS = [
  {id:"sans", name:"Звичайний", css:"-apple-system,'Segoe UI',Roboto,Arial,sans-serif"},
  {id:"serif", name:"Друкований", css:"Georgia,'Times New Roman',serif"},
  {id:"mono", name:"Машинописний", css:"'Courier New',monospace"},
  {id:"hand1", name:"Рукописний", css:"'Comic Sans MS','Comic Sans',cursive"},
  {id:"hand2", name:"Каліграфія", css:"'Brush Script MT',cursive"},
  {id:"deco", name:"Декоративний", css:"Papyrus,fantasy"},
  {id:"treb", name:"Класичний sans", css:"'Trebuchet MS',sans-serif"},
  {id:"pala", name:"Палатіно", css:"'Palatino Linotype','Book Antiqua',Palatino,serif"}
];
const MARKER_COLORS = ["#FFF176","#A5D6A7","#90CAF9","#F48FB1","#FFCC80"];
const NICK_COLORS = ["#7A2E2E","#2F4F3D","#3B5B72","#AB824A","#8E44AD","#C0392B","#16A085"];

/* ============================================================
   ВЛАСНІ ІКОНКИ (замість стандартних емодзі) — прості лінійні SVG,
   колір іде через currentColor, тому підхоплюють колір тексту.
   ============================================================ */
const ICONS = {
  book:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>`,
  calendar:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>`,
  users:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  tag:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.83 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  pencil:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
  clipboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>`,
  megaphone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h2l7 4V5l-7 4H4a1 1 0 0 0-1 1Z"/><path d="M18 8a5 5 0 0 1 0 8"/></svg>`,
  search:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`,
  coin:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v9"/><path d="M9.7 9.3c0-1 1-1.7 2.3-1.7s2.3.6 2.3 1.5c0 1-.9 1.3-2.3 1.7s-2.3.8-2.3 1.8c0 1 1 1.6 2.3 1.6s2.3-.6 2.3-1.6"/></svg>`,
  note:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>`,
  chat:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5Z"/></svg>`,
  thumb:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>`,
  warn:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>`,
  pin:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>`,
  close:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`
};
function icon(name, size){
  size = size || 15;
  const svg = ICONS[name] || "";
  return svg.replace("<svg ", `<svg width="${size}" height="${size}" style="vertical-align:-3px; flex-shrink:0;" `);
}

/* ============================================================
   ЗНАЧКИ-АВАТАРКИ (власний набір замість емодзі) — кольорове коло
   з простим геометричним символом. avatarId зберігається у користувача/класу.
   ============================================================ */
const BADGES = [

  {id:"wave",    name:"Хвиля",     color:"#557790", glyph:`<path d="M2 9c2-3.3 4-3.3 6 0s4 3.3 6 0 4-3.3 6 0 4 3.3 6 0" fill="none" stroke="#F1E8D8" stroke-width="2" stroke-linecap="round"/><path d="M2 15c2-3.3 4-3.3 6 0s4 3.3 6 0 4-3.3 6 0 4 3.3 6 0" fill="none" stroke="#F1E8D8" stroke-width="2" stroke-linecap="round"/>`},

async function dbLoad(){
  try{
    const snap = await fsdb.collection("app").doc(STORAGE_KEY).get();
    if(snap.exists) return snap.data();
  }catch(e){ console.error("Firestore load error:", e); showToast("Немає з'єднання з базою — перевір firebaseConfig"); }
  const fresh = defaultDB();
  await dbSave(fresh);
  return fresh;
}
async function dbSave(db){
  try{
    await fsdb.collection("app").doc(STORAGE_KEY).set(db);
  }catch(e){ console.error("Firestore save error:", e); showToast("Помилка збереження даних"); }
}
// Завжди мутуємо СВІЖУ копію бази, щоб мінімізувати втрату паралельних змін.
async function dbMutate(mutatorFn){
  const fresh = await dbLoad();
  const result = mutatorFn(fresh);
  await dbSave(fresh);
  state.db = fresh;
  return result;
}

async function chatLoad(classId){
  try{
    const snap = await fsdb.collection("chats").doc(classId).get();
    if(snap.exists) return snap.data().messages || [];
  }catch(e){ console.error("Firestore chat load error:", e); }
  return [];
}
async function chatAppend(classId, msg){
  try{
    await fsdb.collection("chats").doc(classId).set(
      { messages: firebase.firestore.FieldValue.arrayUnion(msg) },
      { merge: true }
    );
  }catch(e){ console.error("Firestore chat save error:", e); }
  return chatLoad(classId);
}

function validUsername(s){ return /^[A-Za-z0-9_\-]{3,24}$/.test(s); }
async function adminCreateUser(){
  const login = document.getElementById("nu-login").value.trim();
  const pass = document.getElementById("nu-pass").value;
  const name = document.getElementById("nu-name").value.trim() || login;
  const role = document.getElementById("nu-role").value;
  const avatarId = document.getElementById("nu-avatarid").value || "star";
  if(!validUsername(login)){ showToast("Логін: лише латиниця/цифри/_ , 3-24 символи"); return; }
  if(!pass){ showToast("Вкажіть пароль"); return; }
  let ok = true;
  await dbMutate(db=>{
    if(db.users[login]){ ok=false; return; }
    db.users[login] = {username:login, password:pass, role, name, avatarId, nickColor:null, badge:null, coins:0, behavior:100, blocked:false, classId:null, children:[]};
  });
  if(!ok){ showToast("Такий логін уже існує"); return; }
  showToast("Користувача створено"); render();
}
async function adminSaveUser(username){
  const pw = document.getElementById("pw-"+username).value;
  const av = document.getElementById("av-"+username).value;
  const clsEl = document.getElementById("cls-"+username);
  await dbMutate(db=>{
    const us = db.users[username]; if(!us) return;
    if(pw) us.password = pw;
    if(av) us.avatarId = av;
    if(clsEl){
      const newCls = clsEl.value || null;
      if(us.classId && db.classes[us.classId]){
        db.classes[us.classId].students = db.classes[us.classId].students.filter(x=>x!==username);
      }
      us.classId = newCls;
      if(newCls && db.classes[newCls] && !db.classes[newCls].students.includes(username)){
        db.classes[newCls].students.push(username);
      }
    }
    if(us.role==="parent"){
      const kids = Object.values(db.users).filter(x=>x.role==="student").map(s=>s.username);
      us.children = kids.filter(k=>{
        const box = document.getElementById(`ch-${username}-${k}`);
        return box && box.checked;
      });
    }
  });
  showToast("Збережено"); render();
}
async function adminToggleBlock(username){
  await dbMutate(db=>{ db.users[username].blocked = !db.users[username].blocked; });
  render();
}
function adminDeleteUser(username){
  askConfirm("Видалити користувача "+username+"?", async ()=>{
    await dbMutate(db=>{
      delete db.users[username];
      Object.values(db.classes).forEach(c=>{ c.students = c.students.filter(s=>s!==username); });

    render();

}

function behaviorMarkup(username, editable){
  const us = state.db.users[username];
  const list = state.db.behavior[username]||[];
  const rows = list.map(b=>`
    <tr><td>${b.delta>0?icon("thumb",14):icon("warn",14)} ${b.delta>0?"+":""}${b.delta}</td><td>${escapeHtml(b.text)}</td><td class="small-muted">${b.date}</td></tr>
  `).join("");
  const score = us.behavior;
  const scoreColor = score>=80?"var(--ok)":score>=50?"var(--brass)":"var(--danger)";
  const table = `<div style="font-size:26px; font-weight:700; color:${scoreColor};">${score} / 100</div>
    <table><thead><tr><th>Бали</th><th>Опис</th><th>Дата</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="3" class="subtle">Записів ще немає</td></tr>`}</tbody></table>`;
  if(!editable) return table;
  return table + `
    <div class="row" style="margin-top:8px;">
      <select id="bh-type"><option value="1">+ Похвала</option><option value="-1">− Зауваження</option></select>
      <input type="number" placeholder="Бали (напр. 5)" id="bh-pts" min="1" max="50" value="5">
      <input type="text" placeholder="Опис" id="bh-text">
    </div>
    <button class="btn btn-secondary btn-sm" onclick="addBehaviorFor('${username}')">+ Додати запис</button>`;
}
async function addBehaviorFor(username){
  const dir = Number(document.getElementById("bh-type").value);
  const pts = Math.abs(Number(document.getElementById("bh-pts").value))||0;
  const text = document.getElementById("bh-text").value.trim();
  if(!text || !pts){ showToast("Заповніть опис і бали"); return; }
  const delta = dir*pts;
  const teacher = state.currentUser;
  await dbMutate(db=>{
    ensureArr(db.behavior, username).push({id:uid(), text, delta, date:todayStr(), teacher});
    db.users[username].behavior = Math.max(0, Math.min(100, db.users[username].behavior + delta));
  });
  showToast("Запис додано"); render();
}

    case "behavior": return teacherBehaviorView(u);

    case "notebook": return renderNotebookTab(u);

function renderShopTab(u){
  const eco = state.db.economy;
  if(!eco.enabled) return `<div class="panel"><h2>${icon("coin")} Коіни</h2><div class="empty-note">Систему коінів наразі вимкнено адміністратором.</div></div>`;
  const myGrades = state.db.grades[u.username]||[];
  const items = eco.shop.map(it=>{
    let extra = "";
    if(it.type==="nickcolor"){
      extra = `<div class="row" style="gap:6px; flex-wrap:wrap;">${NICK_COLORS.map(c=>`
        <span class="marker-swatch" style="background:${c}; ${state.shopColorPick===c?'box-shadow:0 0 0 2px var(--ink);':''}" onclick="state.shopColorPick='${c}'; render();"></span>`).join("")}</div>`;
    } else if(it.type==="gradeboost"){
      extra = `<select id="shop-grade-pick">${myGrades.map(g=>`<option value="${g.id}">${escapeHtml(g.subject)} — ${g.grade}</option>`).join("") || '<option value="">— немає оцінок —</option>'}</select>`;
    } else if(it.type==="statusbadge"){
      extra = `<div class="row" style="gap:6px; flex-wrap:wrap;">${BADGES.map(b=>`
        <span onclick="state.shopBadgePick='${b.id}'; render();" title="${b.name}" style="cursor:pointer; border-radius:50%; padding:2px; border:2px solid ${state.shopBadgePick===b.id?'var(--ink)':'transparent'};">${avatarBadge(b.id,26)}</span>`).join("")}</div>`;
    }
    const afford = u.coins >= it.price;
    return `<div class="card">
      <div class="card-title"><span>${escapeHtml(it.name)}</span><span class="coin">${it.price} ${icon("coin",13)}</span></div>
      <div class="small-muted">${escapeHtml(it.desc||"")}</div>
      ${extra}
      <button class="btn btn-brass btn-sm" ${afford?"":"disabled"} onclick="buyShopItem('${it.id}')">Купити</button>
    </div>`;
  }).join("");
  return `<div class="panel">
    <h2>${icon("coin")} Коіни</h2>
    <div style="font-size:22px; font-weight:700;" class="coin">${u.coins} ${icon("coin",18)}</div>
    <p class="subtle">Заробляй коіни за хорошу поведінку та успіхи — вчитель або адміністратор нараховує їх вручну.</p>
    ${items}
  </div>`;
}
async function buyShopItem(itemId){
  const u = state.db.users[state.currentUser];
  const eco = state.db.economy;
  const item = eco.shop.find(i=>i.id===itemId);
  if(!item) return;
  if(u.coins < item.price){ showToast("Недостатньо коінів"); return; }
  if(item.type==="nickcolor" && !state.shopColorPick){ showToast("Оберіть колір"); return; }
  if(item.type==="gradeboost"){
    const gid = document.getElementById("shop-grade-pick").value;
    if(!gid){ showToast("Немає оцінки для покращення"); return; }
    await dbMutate(db=>{
      const us = db.users[state.currentUser];
      const g = (db.grades[us.username]||[]).find(x=>x.id===gid);
      if(!g || g.grade>=GRADE_MAX){ return; }
      g.grade = Math.min(GRADE_MAX, g.grade+1);
      us.coins -= item.price;
    });
    showToast("Оцінку покращено!"); render(); return;
  }
  if(item.type==="statusbadge"){
    if(!state.shopBadgePick){ showToast("Оберіть значок"); return; }
    await dbMutate(db=>{
      const us = db.users[state.currentUser];
      us.badge = state.shopBadgePick; us.coins -= item.price;
    });
    showToast("Значок встановлено"); render(); return;
  }
  if(item.type==="nickcolor"){
    const color = state.shopColorPick;
    await dbMutate(db=>{
      const us = db.users[state.currentUser];
      us.nickColor = color; us.coins -= item.price;
    });
    showToast("Колір ніку змінено"); render(); return;
  }
}

function renderParentTab(u){
  const kids = parentChildren(u);
  if(!kids.length) return `<div class="panel"><h2>Ласкаво просимо</h2><div class="empty-note">Адміністратор ще не прив'язав до вас жодну дитину.</div></div>`;
  const kidSel = state.activeChild && kids.some(k=>k.username===state.activeChild) ? state.activeChild : kids[0].username;
  state.activeChild = kidSel;
  const kid = state.db.users[kidSel];
  const picker = kids.length>1 ? `
    <label>Дитина</label>
    <select onchange="state.activeChild=this.value; render();">${kids.map(k=>`<option value="${k.username}" ${k.username===kidSel?"selected":""}>${escapeHtml(k.name)}</option>`).join("")}</select>` : `<p class="subtle">Дитина: ${escapeHtml(kid.name)}</p>`;

  let body="";
  switch(state.tab){
    case "grades": body = gradesListMarkup(kidSel,false); break;
    case "behavior": body = behaviorMarkup(kidSel,false); break;
    case "homework": body = kid.classId ? renderHomeworkReadOnly(kid.classId) : `<div class="empty-note">Дитину ще не додано до класу.</div>`; break;
    case "schedule": body = kid.classId ? renderScheduleReadOnly(kid.classId) : `<div class="empty-note">Дитину ще не додано до класу.</div>`; break;
    case "chat":
      body = kid.classId ? renderChatPanel(classById(kid.classId)) : `<div class="empty-note">Дитину ще не додано до класу.</div>`;
      break;
    case "announcements": return renderAnnouncements(u);
  }
  const titles = {grades:`${icon("pencil")} Оцінки дитини`, behavior:`${icon("clipboard")} Поведінка`, homework:`${icon("note")} Домашнє завдання`, schedule:`${icon("calendar")} Розклад`, chat:`${icon("chat")} Чат класу`};
  return `<div class="panel"><h2>${titles[state.tab]||""}</h2>${picker}${body}</div>`;
}
function wireParentTab(u){
  const kids = parentChildren(u);
  const kid = kids.find(k=>k.username===state.activeChild) || kids[0];
  if(state.tab==="chat" && kid && kid.classId) wireChatTab(u, kid.classId);
}

function renderChatPanel(cls){
  if(!cls) return `<div class="empty-note">Клас не знайдено.</div>`;
  return `
    <div id="chat-box" class="chat-box"><div class="subtle">Завантаження повідомлень…</div></div>
    <div class="row">
      <input type="text" id="chat-input" placeholder="Повідомлення для класу…">
      <button class="btn btn-primary btn-sm" onclick="sendChatMsg('${cls.id}')">Надіслати</button>
    </div>
    <div class="small-muted" style="margin-top:6px;">Оновлюється автоматично кожні 5 секунд.</div>
  `;
}
function stopChatPoll(){
  if(state.chatPoll){ clearInterval(state.chatPoll); state.chatPoll=null; }
}
async function wireChatTab(u, classId){
  if(!classId) return;
  await refreshChatBox(classId);
  stopChatPoll();
  state.chatPoll = setInterval(()=>refreshChatBox(classId), 5000);
  const inp = document.getElementById("chat-input");
  if(inp) inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); sendChatMsg(classId); } });
}
async function refreshChatBox(classId){
  const box = document.getElementById("chat-box");
  if(!box) return;
  const msgs = await chatLoad(classId);
  const me = state.currentUser;
  box.innerHTML = msgs.map(m=>{
    const sender = state.db.users[m.from];
    const mine = m.from===me;
    const label = sender ? avatarBadge(sender.avatarId,18)+" "+nickSpan(sender) : escapeHtml(m.from);
    return `<div class="msg ${mine?'mine':''}">
      <div class="meta">${label} · ${roleName(m.role)} · ${escapeHtml(m.time)}</div>
      <div class="bubble">${escapeHtml(m.text)}</div>
    </div>`;
  }).join("") || `<div class="subtle">Повідомлень ще немає. Напишіть перше!</div>`;
  box.scrollTop = box.scrollHeight;
}
async function sendChatMsg(classId){
  const inp = document.getElementById("chat-input");
  if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  const u = state.db.users[state.currentUser];
  await chatAppend(classId, {
    from: state.currentUser, role: u.role, text,
    time: new Date().toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"})
  });
  inp.value="";
  await refreshChatBox(classId);
}

function nbNew(){
  state.nbEditingId = null;
  state.nbDraftTitle = "";
  state.nbDraftText = "";
  render();
}
function nbEdit(id){
  const u = state.currentUser;
  const entry = (state.db.notebooks[u]||[]).find(n=>n.id===id);
  if(!entry) return;
  state.nbEditingId = id;
  state.nbDraftTitle = entry.title;
  state.nbDraftText = entry.text;
  state.nbTheme = entry.theme;
  state.nbFont = entry.font;
  render();
}
function nbMark(color){
  const ed = document.getElementById("nb-editor");
  if(ed) ed.focus();
  try{ document.execCommand("hiliteColor", false, color); }
  catch(e){ try{ document.execCommand("backColor", false, color); }catch(e2){} }
  if(ed) state.nbDraftText = ed.innerHTML;
}
async function nbSave(){
  const titleEl = document.getElementById("nb-title");
  const edEl = document.getElementById("nb-editor");
  const title = titleEl ? titleEl.value.trim() : "";
  const text = edEl ? edEl.innerHTML : "";
  const theme = state.nbTheme, font = state.nbFont;
  const username = state.currentUser;
  await dbMutate(db=>{
    const list = ensureArr(db.notebooks, username);
    if(state.nbEditingId){
      const entry = list.find(n=>n.id===state.nbEditingId);
      if(entry){ entry.title=title; entry.text=text; entry.theme=theme; entry.font=font; entry.date=todayStr(); }
    } else {
      const id = uid();
      list.push({id, title, text, theme, font, date: todayStr()});
      state.nbEditingId = id;
    }
  });
  state.nbDraftTitle = title; state.nbDraftText = text;
  showToast("Запис збережено"); render();
}
async function nbDelete(id){
  const username = state.currentUser;
  await dbMutate(db=>{ db.notebooks[username] = (db.notebooks[username]||[]).filter(n=>n.id!==id); });
  if(state.nbEditingId===id){ state.nbEditingId=null; state.nbDraftTitle=""; state.nbDraftText=""; }
  showToast("Видалено"); render();
}

      <div>${escapeHtml(a.text)}</div>
      <div class="small-muted">${escapeHtml(a.author)} · ${a.date}</div>
      ${canManage?`<button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="annTogglePin('${a.id}')">${a.pinned?"Відкріпити":"Закріпити"}</button>`:""}
    </div>`).join("") || `<div class="empty-note">Оголошень ще немає.</div>`;
  const form = canManage ? `
    <h3>Нове оголошення</h3>
    <input type="text" id="ann-title" placeholder="Заголовок">
    <textarea id="ann-text" placeholder="Текст оголошення"></textarea>
    <button class="btn btn-secondary btn-sm" onclick="annAdd()">+ Опублікувати</button>` : "";
  return `<div class="panel"><h2>${icon("megaphone")} Оголошення школи</h2>${items}${form}</div>`;
}
async function annAdd(){
  const titleEl = document.getElementById("ann-title");
  const textEl = document.getElementById("ann-text");
  const title = titleEl.value.trim(), text = textEl.value.trim();
  if(!title || !text){ showToast("Заповніть заголовок і текст"); return; }
  const u = state.db.users[state.currentUser];
  await dbMutate(db=>{ db.announcements.push({id:uid(), title, text, date:todayStr(), author:u.name, pinned:false}); });
  showToast("Опубліковано"); render();
}
async function annDelete(id){
  await dbMutate(db=>{ db.announcements = db.announcements.filter(a=>a.id!==id); });
  render();
}
async function annTogglePin(id){
  await dbMutate(db=>{ const a = db.announcements.find(x=>x.id===id); if(a) a.pinned=!a.pinned; });
  render();
}

/* ============================================================
   ПІДТВЕРДЖЕННЯ ВИДАЛЕННЯ (власне модальне вікно — window.confirm
   може блокуватися в пісочниці артефакту)
   ============================================================ */
function askConfirm(message, onYes){
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:fixed;inset:0;background:rgba(43,38,32,0.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;";
  wrap.innerHTML = `<div style="background:var(--paper);padding:20px;border-radius:4px;max-width:300px;box-shadow:0 6px 24px rgba(0,0,0,0.3); border:1px solid var(--line);">
    <p style="margin:0 0 14px;">${escapeHtml(message)}</p>
    <div class="row">
      <button class="btn btn-outline btn-sm" id="cf-no">Скасувати</button>
      <button class="btn btn-danger btn-sm" id="cf-yes">Так, видалити</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#cf-no").onclick = ()=>wrap.remove();
  wrap.querySelector("#cf-yes").onclick = ()=>{ wrap.remove(); onYes(); };
}

/* ============================================================
   СТАРТ ЗАСТОСУНКУ
   ============================================================ */
(async function init(){
  state.db = await dbLoad();
  if(!AUTH_ENABLED && state.db.users[DEV_AUTOLOGIN_USER]){
    state.currentUser = DEV_AUTOLOGIN_USER;
  }
  render();
})();
</script>
